# Подключение к ClickHouse. На стройке это контейнер из `docker-compose.yml`
# (профиль `logs`), в прогоне CI сервисный контейнер того же образа. Адрес и
# пароль берутся из окружения: в репозитории не лежит ни того, ни другого.
rufinrag:
  target: build
  outputs:
    build:
      type: clickhouse
      schema: rufinrag
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      secure: false
      connect_timeout: 10
      send_receive_timeout: 300
      threads: 1
