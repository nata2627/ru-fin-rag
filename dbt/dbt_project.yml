# Проект витрины над журналом запросов. Модели лежат слоями: staging чистит
# события до того вида, в каком их читает аналитика, marts отвечает на вопросы.
#
# Все модели это представления, а не таблицы. Журнал открытого демо измеряется
# тысячами строк, пересчет представления стоит миллисекунды, а таблица добавила
# бы состояние, которое устаревает между прогонами, и расхождение объяснялось
# бы временем сборки, а не моделью. Станет строк на порядки больше,
# тогда суточные модели переедут в `incremental` по колонке `day`.
name: rufinrag
version: "0.1.0"
config-version: 2
profile: rufinrag

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
log-path: "target/logs"
clean-targets: ["target"]

# Прогон идет в CI без сети наружу, и телеметрия dbt там только добавляет
# секунды ожидания и повод для падения.
flags:
  send_anonymous_usage_stats: false

models:
  rufinrag:
    +materialized: view
