[project]
name = "rufinrag"
version = "0.1.0"
description = "Поиск и ответ по нормативным актам Банка России"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "PyYAML==6.0.2",
    # Нормализация формы русского слова в лексической ступени (решение 16).
    # Версия закреплена точно и обязана совпадать с частью А: правила Snowball
    # между версиями меняются, а выдача сервиса должна совпадать с выдачей
    # бенчмарка. Чистый питон, исходники 0,8 МБ, своих зависимостей нет,
    # поэтому в образ сервиса это проходит без разговоров.
    "snowballstemmer==3.0.1",
]

# Плотный поиск и переранжирование тянут torch, а он не нужен ни тестам BM25,
# ни образу сервиса в режиме по умолчанию (DECISIONS, решение 7).
[project.optional-dependencies]
dense = [
    "torch==2.3.1",
    "sentence-transformers==3.0.1",
    "transformers==4.41.2",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "httpx==0.28.1",
]
# Витрина над журналом запросов. Ставится движок ClickHouse внутри процесса
# (`chdb-core`), а не обертка `chdb`: обертка тянет pandas и pyarrow ради
# вывода в DataFrame, которым витрина не пользуется, и их версии пришлось бы
# согласовывать с пином numpy 1.26.4. Колесо 115 МБ, на диске 354 МБ, поэтому
# в образ сервиса оно не идет: образ ставит только основные зависимости, а
# витрину считает прогон CI (src/rufinrag/warehouse.py).
analytics = [
    "chdb-core==26.9.0",
]
# Трекинг прогонов обучения и оценки (задача 6.3). Берется skinny, то есть
# клиент с файловым хранилищем, без сервера, веба, pandas и sqlalchemy: сервер
# стоит денег и рук, а проект обязан работать без того и другого. Прибавка к
# окружению 66 МБ, замерено установкой. В образ сервиса это не идет: свою
# версию сервис читает из results/registry.json (src/rufinrag/registry.py).
tracking = [
    "mlflow-skinny==2.19.0",
]
# Роутер на инструментах (задача 8.2). LangGraph стоит 70 МБ в окружении и
# 66,3 МБ памяти на импорт, замерено установкой, а пик сервиса на лексической
# связке 215 МБ при 512 МБ бесплатного тарифа. Поэтому библиотека не идет в
# основные зависимости, и роутер поднимается только там, где его включили
# переменной RUFINRAG_ROUTER=1: без нее сервис отвечает прямым поиском и
# библиотеку не импортирует вовсе (src/rufinrag/router.py).
router = [
    "langgraph==1.2.17",
]
# Модели витрины. dbt умеет говорить только с сервером ClickHouse, поэтому это
# дополнение нужно стройке и прогону CI, где сервер есть, а не бесплатному
# режиму: там те же модели исполняет движок из `analytics`
# (src/rufinrag/warehouse.py). Замыкание зависимостей измерено в
# results/dbt.json, в образ сервиса оно не идет по той же причине, что и
# `analytics`: на бесплатном тарифе 512 МБ памяти, и рядом с индексом места
# нет.
dbt = [
    "dbt-core==1.9.4",
    "dbt-clickhouse==1.9.2",
]
# Докачка новых актов ночным прогоном. Пакет части А ставится из этого же
# репозитория (`pip install -e ./retrieval`), а не тянется по закрепленному
# коммиту со стороны: после слияния двух репозиториев (решение 22) внешняя
# ссылка означала бы, что самодостаточный проект зависит от архивного
# репозитория. Нарезка при этом обязана совпадать до символа, иначе
# идентификаторы новых фрагментов разойдутся с теми, что уже лежат в корпусе,
# и теперь это гарантирует не закрепленный хеш, а один рабочий каталог на
# обе части. Токенизатор нужен тому же счету длины, torch не ставится:
# у части А он лежит в дополнении, а не в основных зависимостях.
collect = [
    "transformers==4.41.2",
    "sentencepiece==0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Комментарии и строки в проекте по-русски, поэтому правила про похожие на
# латиницу кириллические буквы ругаются на каждую строку текста.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    # Слой ответа вынесен в отдельный шаг scripts/check.sh: выход задач 7.1 и
    # 7.2 это «оба режима отвечают», и в выводе проверки это должно быть видно
    # строкой, а не растворяться в общем прогоне.
    "answer: слой ответа, выдержки и генерация с подставной моделью",
    "slow: поднимает сервис процессом, десятки секунд",
    "clickhouse: требует ClickHouse сервером, docker compose --profile logs up -d",
]
