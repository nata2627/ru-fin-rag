# Профили, а не один большой стек: на маке 8 ГБ памяти, и поднимать все сразу
# нельзя (TASK, раздел «Ограничения»). `docker compose --profile search up`
# поднимает поиск, `--profile vectors` добавляет Qdrant, `--profile logs`
# добавляет ClickHouse. Бесплатный хостинг после сдачи работает без compose:
# там только образ сервиса (DECISIONS, решение 8).
services:
  api:
    profiles: ["search"]
    build: .
    ports:
      - "8000:8000"
    environment:
      RUFINRAG_LIVE: "${RUFINRAG_LIVE:-}"
      RUFINRAG_DISABLE_DENSE: "${RUFINRAG_DISABLE_DENSE:-}"
      QDRANT_URL: "${QDRANT_URL:-}"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  qdrant:
    profiles: ["vectors"]
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Память ограничена явно: иначе на восьми гигабайтах мака Qdrant и сервис
    # вместе уводят систему в подкачку, и замеры задержки перестают что-либо
    # значить.
    deploy:
      resources:
        limits:
          memory: 2g

  # Хранилище логов на стройке. В бесплатном режиме этого сервиса нет вовсе:
  # события остаются файлами JSONL в репозитории, и считает по ним chdb, тот же
  # движок внутри процесса (src/rufinrag/warehouse.py).
  clickhouse:
    profiles: ["logs"]
    image: clickhouse/clickhouse-server:25.8-alpine
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_storage:/var/lib/clickhouse
    environment:
      # Пользователь без пароля и база для журнала. Сервер поднимается только
      # на стройке и слушает localhost, наружу он не выходит.
      CLICKHOUSE_DB: rufinrag
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    # По умолчанию ClickHouse забирает под кэши долю всей памяти машины, а на
    # маке с восьмью гигабайтами это уводит систему в подкачку.
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  qdrant_storage:
  clickhouse_storage:
