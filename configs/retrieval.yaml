# Связки поиска. Смена связки это правка этого файла, а не правка кода
# (SPEC, раздел 3). Имена конфигураций те же, что в части А, чтобы числа
# сходились по имени: bm25, hybrid, hybrid-rerank.
version: 1
default: hybrid

configs:
  bm25:
    first_stage: bm25
    candidates: 50
    rerank: null
    note: базовая линия, 0,571 NDCG@10 на 991 запросе в части А

  dense:
    first_stage: dense
    candidates: 50
    dense_model: rufin
    rerank: null
    note: >
      только плотный поиск, нужен для сравнения ступеней по задержке и качеству.
      В части А эта модель дала 0,548 на 991 запросе и просадку на живых вопросах

  bm25-rerank:
    first_stage: bm25
    candidates: 50
    rerank:
      model: BAAI/bge-reranker-v2-m3
      depth: 50
      batch_size: 8
      max_length: 512
    note: >
      лексический поиск с переранжированием, нужен чтобы отделить вклад реранка
      от вклада плотной части

  hybrid:
    first_stage: hybrid
    candidates: 50
    dense_model: rufin
    rrf_k: 60
    rerank: null
    note: >
      режим по умолчанию в онлайне (DECISIONS, решение 6). Плотная часть идет на
      существующих 384-мерных векторах, потому что векторов user-bge-m3 на диске
      нет (DECISIONS, решение 8)

  hybrid-rerank:
    first_stage: hybrid
    candidates: 50
    dense_model: rufin
    rrf_k: 60
    rerank:
      model: BAAI/bge-reranker-v2-m3
      depth: 50
      batch_size: 8
      max_length: 512
    note: >
      лучшая по качеству связка части А (0,690 на 991, 0,421 на живых) и самая
      дорогая: 48,0 с на запрос на CPU мака и 20,4 с на MPS при глубине 50
      (results/artifacts.md). В онлайне по умолчанию не включается

  hybrid-graph:
    first_stage: hybrid
    candidates: 50
    dense_model: rufin
    rrf_k: 60
    rerank: null
    graph:
      mode: reserve
      direction: forward
      seeds: 3
      reserve: 1
    note: >
      расширение выдачи по цитированию: десятое место отдается лучшему фрагменту
      акта, на который ссылается один из трех первых найденных. Параметры выбраны
      на подвыборке dev из сетки 18 точек. Замер
      (results/graph-expansion.json, EXPERIMENTS S20): 0,0001 [-0,0014; 0,0018]
      NDCG@10 на 991 запросе, то есть ничего, и минус 0,0108 [-0,0298; 0,0043]
      на 25 вопросах про связанные акты. Связка оставлена отдельной и по
      умолчанию не включается. Второй режим расширения, mode fusion, в коде есть
      и проиграл базе 0,1301 [0,1166; 0,1438] NDCG@10 на тех же 991
