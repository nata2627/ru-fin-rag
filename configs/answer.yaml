# Слой ответа: порог отказа и размеры выдержек. Смена порога это правка этого
# файла, а не правка кода (SPEC, раздел 3).
#
# Порог не придуман: он выведен замером `scripts/measure_answer.py` по правилу,
# записанному до чисел (orchestration/EXPERIMENTS.md, S21), и числа лежат в
# results/answer.json. Правило: порог это 1-процентный квантиль признака опоры
# по 991 размеченному запросу эталонного набора, то есть бюджет ложных отказов
# 9 запросов из 991. Измерено по этому порогу: ложных отказов 9 из 991, отказов
# на вопросах вне предметной области 9 из 20, на вопросах рядом с предметной
# областью 0 из 20. Признак слабый, и это напечатано числом, а не спрятано.
version: 1

support:
  # Признак опоры из трех кандидатов, два из которых взяты у монитора доли
  # запросов без хорошего ответа (rufinrag.monitoring): двух разных «отсутствий
  # опоры» в проекте быть не должно. Выбран `idf_coverage`, доля информативности
  # запроса, покрытая лучшим фрагментом. У `top_score` доля отказов вне корпуса
  # выше (20 из 40 против 9 из 40), но он растет с длиной запроса (корреляция
  # Спирмена 0,86), и все 6 его ложных отказов на эталоне лежат в самой короткой
  # четверти вопросов: порог, выведенный на длинных вопросах набора, отказывал бы
  # короткому запросу по длине, а не по отсутствию опоры (S21, поправка 24.10).
  feature: idf_coverage
  threshold: 0.24
  # По скольким первым фрагментам выдачи ищется лучшая опора.
  depth: 10
  measured_in: results/answer.json

excerpts:
  # Сколько выдержек идет в ответ без ключа модели.
  citations: 5
  # Длина выдержки. 400 символов это около двух предложений нормативного
  # текста: медиана выбранного окна вышла 407 символов на 991 запросе.
  quote_chars: 400

generation:
  # Сколько выдержек уходит в подсказку модели. Меньше, чем в режиме выдержек:
  # на карте 8 ГБ (DECISIONS, решение 13) окно модели короткое, и пять выдержек
  # по 400 символов это уже около 500 токенов подсказки.
  excerpts: 5
  max_tokens: 700
  # Ноль, а не мягкая температура: ответ обязан держаться выдержек, и разброс
  # здесь это разброс формулировок нормы.
  temperature: 0.0
  timeout_seconds: 60
