# Та же проверка, что `scripts/check.sh` на маке: линтер, тесты, числа
# публичных текстов, поиск секретов. Нужна не ради галочки: ночной регламент
# коммитит в этот же репозиторий, и поломка, уехавшая в main, ломает регламент,
# а не только сборку.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ClickHouse сервером рядом с прогоном: сверка двух режимов витрины
    # (tests/test_warehouse.py) иначе пропускалась бы всюду, кроме мака с
    # поднятым докером, то есть проверялась бы руками.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        # Без этой переменной entrypoint образа закрывает пользователю
        # `default` сетевой доступ, и сервер отвечает 401 на любой запрос с
        # хоста прогона. В `docker-compose.yml` она стоит с самого начала,
        # здесь ее не было, поэтому работа падала там, где на маке зеленела.
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[analytics,dev]'

      # Плотная часть требует torch и весов модели запроса: 1,1 ГБ, на прогон
      # проверки это лишние пять минут. Тесты плотной ступени ее пропускают.
      - name: Run check
        env:
          PY: python
          RUFINRAG_DISABLE_DENSE: "1"
        run: scripts/check.sh

      # Сборка страницы дашборда целиком, командой, а не вызовом из теста. В
      # ночном прогоне этот шаг падает мягко, поэтому поломку сборки ловить
      # приходится здесь, где прогон краснеет.
      - name: Build the dashboard on the collected set
        run: python scripts/build_dashboard.py --sample

  # Алерт по деградации метрики проверяется прогоном, а не только тестом: тест
  # сверяет правила лестницы на готовых числах, а здесь метрика действительно
  # падает на поврежденном корпусе, и прогон регрессии действительно краснеет.
  # Работа отдельная, потому что это пять прогонов регрессии по 991 вопросу, и
  # тестам ждать их незачем.
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Drill the quality alert
        env:
          RUFINRAG_DISABLE_DENSE: "1"
        run: python scripts/check_alert.py

      # Числа ступеней из прогона CI: в репозитории лежит замер с мака, и по
      # артефакту видно, что на другой машине лестница ведет себя так же.
      - name: Keep the drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-drill
          path: results/alert-drill.json
          retention-days: 14

  # Витрина собирается отдельной работой, а не рядом с тестами: dbt тянет свое
  # замыкание зависимостей (results/dbt.json), а тестам оно не нужно ни одной
  # строкой. Так прогон проверки не ждет установки dbt, а сборка витрины не
  # ждет тестов.
  mart:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        # Без этой переменной entrypoint образа закрывает пользователю
        # `default` сетевой доступ, и сервер отвечает 401 на любой запрос с
        # хоста прогона. В `docker-compose.yml` она стоит с самого начала,
        # здесь ее не было, поэтому работа падала там, где на маке зеленела.
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `analytics` здесь рядом с `dbt` не случайно: прогон сравнивает вывод
      # собранных моделей с тем, что по тем же моделям считает бесплатный
      # режим, и для этого нужны оба движка.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[analytics,dbt]'

      - name: Build the mart and compare it with the free mode
        run: python scripts/build_mart.py

      # Отчет dbt о прогоне и скомпилированный SQL каждой модели: по ним видно,
      # что именно собралось, без повторного запуска на чужой машине.
      - name: Keep the dbt build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target
          retention-days: 14
