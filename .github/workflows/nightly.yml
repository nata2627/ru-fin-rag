# Ночной регламент: докачать новые акты, пересобрать индекс, прогнать регрессию
# на замороженном наборе и закоммитить результаты от имени бота.
#
# Почему прогон живет здесь, а не на хостинге: бесплатный тариф Render засыпает
# и расписания не держит, а GitHub Actions дает 2000 минут в месяц на публичный
# репозиторий бесплатно. Прогон не трогает хостинг: пуш в main переразворачивает
# сервис сам, это настроено в render.yaml.
#
# Пакет части А ставится дополнением `collect` из pyproject: коммит закреплен
# там, в одном месте.
name: nightly

on:
  schedule:
    # Два раза в сутки: выпуски «Вестника» выходят днем, а прогон в
    # установившемся режиме стоит 25 с и шесть запросов к cbr.ru, то есть
    # второй заход почти ничего не стоит и сокращает задержку новых актов
    # вдвое. Минуты не круглые: в начале часа у GitHub пик очереди на
    # расписаниях, и прогон может сдвинуться на десятки минут.
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pdftotext из poppler: им часть А извлекает текст из PDF «Вестника»
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ".[collect]"
          # Пакет части А из этого же репозитория: после слияния внешняя
          # ссылка на архивный репозиторий была бы единственным, что мешает
          # собрать проект из одного клона.
          pip install -e ./retrieval

      # Отказ cbr.ru не отменяет остальной прогон. Корпус лежит на диске и от
      # отказа не портится, поэтому переиндексация, регрессия и отметка живости
      # идут как обычно, а issue открывается шагом ниже без красного main.
      # Код 75 это «сайт отказал, попробуй позже», любой другой ненулевой код
      # это поломка нашего кода, и тогда прогон обязан покраснеть.
      - name: Fetch new acts
        id: corpus
        env:
          RUFINRAG_LIVE: "1"
        run: |
          set +e
          python scripts/update_corpus.py
          code=$?
          set -e
          if [ "$code" = "75" ]; then
            echo "status=source_unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" = "0" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=broken" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Regression on the frozen benchmark
        env:
          RUFINRAG_DISABLE_DENSE: "1"
        run: python scripts/run_regression.py --config bm25

      # Журнал запросов живет на эфемерном диске хостинга и пропадает вместе с
      # контейнером, а сам сервис коммитить в репозиторий не может: для этого
      # нужен был бы токен со сроком (DECISIONS, решение 12). Поэтому строки
      # забирает прогон. Шаг не роняет прогон ни при одном внешнем отказе:
      # спящий сервис, незаданный секрет и пустой журнал это нормальные
      # состояния, а красный main останавливает часы приемки автономности.
      # Состояние последней выгрузки лежит в results/events.json.
      - name: Drain the query log into the repository
        env:
          RUFINRAG_SERVICE_URL: https://ru-fin-rag.onrender.com
          RUFINRAG_EVENTS_TOKEN: ${{ secrets.RUFINRAG_EVENTS_TOKEN }}
        run: python scripts/drain_events.py

      # Мониторинг трех сигналов одним шагом: дрейф распределения запросов и
      # доля запросов без хорошего ответа считаются по журналу, а деградацию на
      # эталонном наборе шаг берет готовой из results/regression.json, чтобы
      # число в issue и число в отчете не разошлись.
      #
      # Шаг не роняет прогон нарочно. Дрейф запросов и доля без ответа это не
      # поломка регламента, а свойство трафика: алерт уходит тем же путем, что
      # отказ cbr.ru, то есть issue при зеленом прогоне. Красный main обнулил бы
      # часы приемки автономности. Поломка самого мониторинга (нет замера
      # порогов, битый журнал) красит прогон, и это другой случай.
      - name: Monitor query drift and the answerless share
        id: monitoring
        run: python scripts/check_monitoring.py

      # Отчет регламента зависит от чисел докачки, а их перезаписывает этот же
      # прогон. Значит он обязан пересобираться здесь, иначе зафиксированный
      # файл расходится с замером к утру, и проверка чисел краснеет на ровном
      # месте.
      - name: Rebuild the regulation report
        run: python scripts/report_dag.py

      # Версия корпуса меняется докачкой, значит меняется и версия выпуска:
      # реестр обязан пересобираться здесь, иначе сервис до утра отвечает с
      # пометкой расхождения, а числа README остаются про прошлую сборку.
      # Отпечатки весов и векторов прогон не видит (в git они не едут) и
      # переносит из прежней записи, не теряя их.
      - name: Rebuild the version registry
        run: python scripts/register_versions.py

      - name: Verify published numbers
        run: python scripts/verify_numbers.py

      # Отметка живости. У GitHub расписание в публичном репозитории тихо
      # выключается после 60 дней без активности, а в спокойный период прогон
      # не меняет ни корпус, ни метрики, то есть не коммитит ничего. Эта
      # строка меняется всегда, поэтому коммит есть каждую ночь.
      - name: Record the heartbeat
        run: python scripts/record_heartbeat.py

      # Отметка живости только что увеличила счетчик прогонов, а он стоит
      # строкой в таблице навыков README. Таблица вписывается скриптом после
      # отметки: иначе следующий прогон упал бы на сверке чисел, а красный
      # main остановил бы часы приемки автономности.
      - name: Rewrite the skills table
        run: python scripts/skills_table.py --write

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus/chunks.jsonl.gz data/corpus/skipped.json \
            results/corpus-update.json results/regression.json results/regulation.json \
            results/monitoring.json results/dag.md results/registry.json \
            data/events results/events.json README.md
          if git diff --cached --quiet; then
            echo "нечего коммитить: корпус и метрики не изменились"
          else
            git commit -m "Nightly corpus update, regression and query log"
            # Ветка могла уехать вперед, пока шел прогон: человек пушит в тот же
            # main. Перебазируемся и пробуем снова, иначе прогон падает на ровном
            # месте и открывает issue про поломку, которой нет.
            #
            # --autostash обязателен. Шаги до этого перезаписывают файлы, которых
            # нет в списке `git add` выше (индекс, страница дашборда, запись
            # приемки), и для git это незакоммиченные правки, с которыми он
            # отказывается перебазироваться. Плановый прогон 23.10 упал ровно так:
            # «cannot pull with rebase: You have unstaged changes».
            git pull --rebase --autostash origin main
            git push
          fi

      # Срабатывает на поломке, на отказе cbr.ru и на алерте мониторинга. Два
      # последних случая прогон не роняют, но и молчать о них нельзя: issue это
      # единственный канал, в котором они видны без чтения логов.
      #
      # Второго issue от нового алерта не появляется: открытый issue с той же
      # меткой ищется до всего остального, и, если он есть, текст уходит
      # комментарием в него. Метка одна на все три случая нарочно, иначе две
      # метки дали бы два issue про одну ночь.
      - name: Open an issue when the run breaks, cbr.ru refuses or monitoring alerts
        if: >-
          failure() || cancelled()
          || steps.corpus.outputs.status == 'source_unavailable'
          || steps.monitoring.outputs.alert == 'fired'
        uses: actions/github-script@v7
        env:
          SOURCE_STATUS: ${{ steps.corpus.outputs.status }}
          MONITORING_ALERT: ${{ steps.monitoring.outputs.alert }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs')
            const marker = 'nightly-broken'
            const refused = process.env.SOURCE_STATUS === 'source_unavailable'
            const alerted = process.env.MONITORING_ALERT === 'fired'
            const broken = process.env.JOB_STATUS !== 'success'
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: marker,
            })
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const read = (name) => {
              try {
                return JSON.parse(fs.readFileSync(name, 'utf8'))
              } catch (err) {
                // Прогон мог упасть до того, как отчет написан: тогда в тексте
                // просто не будет строки с числом, а не весь шаг развалится.
                return {}
              }
            }
            const regression = read('results/regression.json')
            const monitoring = read('results/monitoring.json')
            // Деградация на эталонном наборе печатается отдельной строкой ниже,
            // поэтому здесь остаются сигналы про трафик: иначе одно и то же
            // число стояло бы в issue дважды. Тексты собирает
            // scripts/check_monitoring.py, здесь они только печатаются, и
            // знаменатель в них уже есть.
            const traffic = (monitoring.signals || []).filter(
              (signal) => signal.fired && signal.name !== 'benchmark_regression')
            const window = monitoring.window || {}
            const journal = monitoring.journal || {}
            const monitoringLines = alerted ? [
              '',
              'Алерт мониторинга:',
              ...(traffic.length
                ? traffic.map((signal) => `- ${signal.text}`)
                : [`- ${monitoring.alert?.text || 'текст алерта не записан'}`]),
              `Окно: ${window.collected ?? '?'} из ${window.needed ?? '?'} нужных запросов;`
                + ` всего в журнале ${journal.queries ?? '?'} запросов, суток`
                + ` ${journal.days ?? '?'}.`,
              'Пороги измерены, разбор в results/monitoring-thresholds.json и',
              'results/monitoring-drill.json, состояние в results/monitoring.json.',
            ] : []
            const refusedBody = [
              'cbr.ru не отдал перечень «Вестника», и докачка новых актов отложена до следующего',
              'прогона. Прогон на этом не остановился: корпус на диске цел, индекс пересобран,',
              'регрессия посчитана, отметка живости записана, `main` остался зеленым.',
              '',
              `Ошибка источника: \`${read('results/corpus-update.json').source_error || 'не записана'}\``,
              `Прогонов подряд без связи с cbr.ru: ${read('results/regulation.json').source_unavailable_runs ?? 'неизвестно'}`,
              `Лог: ${url}`,
              '',
              'Вежливый клиент части А делает три попытки с паузой, и отказ сайта он по существу',
              'не переваривает: 403 это отказ, а не сетевая икота, и четвертая попытка с того же',
              'адреса даст то же самое. Один-два прогона так это обычная рябь. Если счетчик выше',
              'растет несколько суток, значит cbr.ru перестал пускать бесплатные раннеры GitHub,',
              'и докачку придется запускать с другой машины. Это ограничение автономности, и его',
              'надо назвать в README, а не лечить обходом чужой защиты.',
            ]
            const brokenBody = [
              'Ночной прогон упал. Сервис от этого не останавливается: он отвечает на том корпусе,',
              'который уже лежит в репозитории, а regression.json остался от прошлого прогона.',
              '',
              `Лог: ${url}`,
              // Текст алерта по деградации метрики собирает прогон регрессии
              // (scripts/run_regression.py), здесь он только печатается: иначе
              // число в issue и число в отчете разошлись бы.
              regression.alert?.fired
                ? `\nАлерт по качеству: ${regression.alert.text}. Порог измерен, разбор`
                  + ' в results/alert-threshold.json и results/alert-drill.json.'
                : '',
              '',
              'Что бывает причиной, по частоте:',
              '1. Поменялась верстка поиска по «Вестнику» на cbr.ru, и перечень актов разобран',
              '   в ноль: статус `index_not_parsed` в results/corpus-update.json.',
              '2. Регрессия качества: NDCG@10 упал больше порога после обновления корпуса.',
              '3. Истек токен или пропали права: тогда падает шаг коммита, а не шаг сбора.',
              '4. Прогон снят по таймауту в 45 минут: тогда статус прогона `cancelled`.',
              '5. Пуш отклонен: кто-то писал в main в те же секунды. Прогон перебазируется сам,',
              '   но если не вышло, следующей ночью это повторится.',
              '',
              'Отказ cbr.ru в этот список больше не входит: от него прогон не краснеет, а',
              'открывает issue с пометкой, что докачка отложена.',
              '',
              'Прогон можно запустить руками: вкладка Actions, workflow nightly, кнопка Run workflow.',
            ]
            const alertBody = [
              'Ночной прогон прошел зеленым, а мониторинг поднял алерт. Сервис отвечает, корпус',
              'цел, регламент идет дальше: это сигнал про трафик, а не поломка.',
              '',
              `Лог: ${url}`,
              '',
              'Что с этим делать:',
              '1. Дрейф распределения запросов: посмотреть, какой признак сдвинулся (поле',
              '   `worst_feature` в results/monitoring.json) и сами запросы в data/events. Порог',
              '   выведен из разброса на замороженном наборе вопросов, живого трафика в нем нет,',
              '   и первая версия алерта на живых запросах может оказаться слишком строгой.',
              '2. Доля запросов без хорошего ответа: признак опоры это оценка лучшего кандидата',
              '   поиска, и он слабый. Его ошибки в обе стороны со знаменателями лежат в',
              '   results/monitoring-thresholds.json, поле support_candidates.',
              '',
              'Прогон можно запустить руками: вкладка Actions, workflow nightly, кнопка Run workflow.',
            ]
            const body = [
              ...(broken ? brokenBody : refused ? refusedBody : alertBody),
              ...monitoringLines,
            ].join('\n')
            const title = broken
              ? 'Ночной прогон упал'
              : refused
                ? 'Ночной прогон зеленый, cbr.ru не отдал перечень'
                : 'Ночной прогон зеленый, сработал алерт мониторинга'
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: [marker], body,
              })
            }
