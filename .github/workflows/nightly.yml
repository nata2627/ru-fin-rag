# Ночной регламент: докачать новые акты, пересобрать индекс, прогнать регрессию
# на замороженном наборе и закоммитить результаты от имени бота.
#
# Почему прогон живет здесь, а не на хостинге: бесплатный тариф Render засыпает
# и расписания не держит, а GitHub Actions дает 2000 минут в месяц на публичный
# репозиторий бесплатно. Прогон не трогает хостинг: пуш в main переразворачивает
# сервис сам, это настроено в render.yaml.
#
# Пакет части А ставится дополнением `collect` из pyproject: коммит закреплен
# там, в одном месте.
name: nightly

on:
  schedule:
    # Два раза в сутки: выпуски «Вестника» выходят днем, а прогон в
    # установившемся режиме стоит 25 с и шесть запросов к cbr.ru, то есть
    # второй заход почти ничего не стоит и сокращает задержку новых актов
    # вдвое. Минуты не круглые: в начале часа у GitHub пик очереди на
    # расписаниях, и прогон может сдвинуться на десятки минут.
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pdftotext из poppler: им часть А извлекает текст из PDF «Вестника»
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ".[collect]"

      - name: Fetch new acts
        id: corpus
        env:
          RUFINRAG_LIVE: "1"
        run: python scripts/update_corpus.py

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Regression on the frozen benchmark
        env:
          RUFINRAG_DISABLE_DENSE: "1"
        run: python scripts/run_regression.py --config bm25

      - name: Verify published numbers
        run: python scripts/verify_numbers.py

      # Отметка живости. У GitHub расписание в публичном репозитории тихо
      # выключается после 60 дней без активности, а в спокойный период прогон
      # не меняет ни корпус, ни метрики, то есть не коммитит ничего. Эта
      # строка меняется всегда, поэтому коммит есть каждую ночь.
      - name: Record the heartbeat
        run: python scripts/record_heartbeat.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus/chunks.jsonl.gz data/corpus/skipped.json \
            results/corpus-update.json results/regression.json results/regulation.json
          if git diff --cached --quiet; then
            echo "нечего коммитить: корпус и метрики не изменились"
          else
            git commit -m "Nightly corpus update and regression"
            # Ветка могла уехать вперед, пока шел прогон: человек пушит в тот же
            # main. Перебазируемся и пробуем снова, иначе прогон падает на ровном
            # месте и открывает issue про поломку, которой нет.
            git pull --rebase origin main
            git push
          fi

      - name: Open an issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'nightly-broken'
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: marker,
            })
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'Ночной прогон упал. Сервис от этого не останавливается: он отвечает на том корпусе,',
              'который уже лежит в репозитории, а regression.json остался от прошлого прогона.',
              '',
              `Лог: ${url}`,
              '',
              'Что бывает причиной, по частоте:',
              '1. Поменялась верстка поиска по «Вестнику» на cbr.ru, и перечень актов пришел пустым.',
              '2. cbr.ru не ответил или ответил ошибкой: прогон повторяется следующей ночью сам.',
              '3. Регрессия качества: NDCG@10 упал больше порога после обновления корпуса.',
              '4. Истек токен или пропали права: тогда падает шаг коммита, а не шаг сбора.',
              '5. Прогон снят по таймауту в 45 минут: тогда статус прогона `cancelled`.',
              '6. Пуш отклонен: кто-то писал в main в те же секунды. Прогон перебазируется сам,',
              '   но если не вышло, следующей ночью это повторится.',
              '',
              'Прогон можно запустить руками: вкладка Actions, workflow nightly, кнопка Run workflow.',
            ].join('\n')
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Ночной прогон упал', labels: [marker], body,
              })
            }
