# Дашборд: страница собирается по тем же моделям витрины и уезжает на GitHub
# Pages. Отдельным прогоном от ночного регламента по трем причинам. Движок
# витрины это 354 МБ, а обновлению корпуса он не нужен ни строкой. Страница
# должна обновляться с каждым изменением результатов, а не дважды в сутки по
# расписанию. И отметка живости регламента считает свои прогоны: публикация
# страницы не повод увеличивать их число.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "scripts/build_dashboard.py"
      - "src/**"
      - ".github/workflows/pages.yml"
  # Ночной прогон коммитит новые числа от имени бота, а коммит с токеном
  # прогона чужих прогонов не запускает: правило GitHub против рекурсии. Без
  # этого повода страница обновлялась бы только с ее пушей, а ночные числа
  # лежали бы в репозитории и не доезжали до ссылки. Часовая выгрузка журнала
  # коммитит тем же токеном, поэтому стоит здесь же.
  workflow_run:
    workflows: [nightly, drain]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Ветка, а не коммит события: после ночного прогона нужны числа из
      # коммита бота, который сделан уже после его начала.
      - uses: actions/checkout@v4
        with:
          ref: main

      # Журнал запросов лежит в приватном репозитории ru-fin-rag-events: в нем
      # тексты чужих запросов, и публиковать их незачем (решение 19.11.2026).
      # Ключ развертывания без срока и пишет только в этот репозиторий, так что
      # автономность от него не зависит от истекающего токена.
      - name: Check out the private query log
        uses: actions/checkout@v4
        with:
          repository: nata2627/ru-fin-rag-events
          ssh-key: ${{ secrets.EVENTS_DEPLOY_KEY }}
          path: data/events

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[analytics]'

      # Пустой журнал это не ошибка: страница собирается и говорит, что данных
      # пока нет.
      - name: Build the dashboard
        run: python scripts/build_dashboard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Изредка deploy-pages не видит только что загруженный артефакт: API
      # артефактов отстает, и прогон падает с "No artifacts named github-pages",
      # хотя артефакт в нем есть (2 из 69 прогонов к 21.11.2026). Повтор через
      # минуту этот случай закрывает, настоящая ошибка упадет и во второй раз.
      - id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy_first.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: deploy
        run: echo "page_url=${{ steps.deploy_first.outputs.page_url || steps.deploy_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
