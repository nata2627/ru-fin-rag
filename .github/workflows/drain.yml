# Выгрузка журнала запросов каждый час, отдельно от ночного регламента.
#
# Журнал живет на эфемерном диске хостинга и пропадает при каждом перезапуске
# контейнера: после сна и после передеплоя на каждый коммит бота. Ночной прогон
# забирает его дважды в сутки, и до 19.11.2026 в 8 из 9 выгрузок между ними был
# перезапуск, то есть дневной запрос почти всегда пропадал раньше, чем его
# забирали. Час короче типичной жизни контейнера.
#
# Строки уходят в приватный репозиторий ru-fin-rag-events, публичный этот
# прогон не трогает: коммит в публичный main передеплоивал бы сервис каждый
# час. Счетчики results/events.json поэтому обновляет только ночной прогон.
#
# Минуты не стоят ничего: для публичного репозитория стандартные раннеры
# GitHub Actions бесплатны. Скрипт выгрузки на стандартной библиотеке, пакеты
# не ставятся.
name: drain

on:
  schedule:
    # Не в начале часа: там у GitHub пик очереди расписаний.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Журнал запросов лежит в приватном репозитории ru-fin-rag-events: в нем
      # тексты чужих запросов, и публиковать их незачем (решение 19.11.2026).
      # Ключ развертывания без срока и пишет только в этот репозиторий, так что
      # автономность от него не зависит от истекающего токена.
      - name: Check out the private query log
        uses: actions/checkout@v4
        with:
          repository: nata2627/ru-fin-rag-events
          ssh-key: ${{ secrets.EVENTS_DEPLOY_KEY }}
          path: data/events

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Шаг не роняет прогон ни при одном внешнем отказе (scripts/drain_events.py).
      - name: Drain the query log
        env:
          RUFINRAG_SERVICE_URL: https://ru-fin-rag.onrender.com
          RUFINRAG_EVENTS_TOKEN: ${{ secrets.RUFINRAG_EVENTS_TOKEN }}
        run: python scripts/drain_events.py

      # Новые строки уходят в приватный репозиторий журнала сразу после
      # выгрузки: упади прогон ниже, события уже сохранены.
      - name: Push the query log to the private repository
        working-directory: data/events
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "новых событий нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Query log drain"
          git pull --rebase origin main
          git push origin HEAD:main
