# Чертеж для Render: сервис собирается из этого репозитория и переразворачивается
# на каждый пуш в main. Токен для этого не нужен, связь репозитория и сервиса
# заводится один раз в браузере и не истекает (DECISIONS, решение 11).
services:
  - name: ru-fin-rag
    type: web
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install . && python scripts/build_index.py
    startCommand: python -m uvicorn rufinrag.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Версию питона Render берет из `.python-version` или из этой переменной,
      # а `runtime.txt` (соглашение Heroku) он не читает. Из-за этого первая
      # сборка 22.10.2026 упала: окружение поднялось на питоне по умолчанию, а
      # пакет требует ровно 3.11 (`requires-python` в pyproject.toml).
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Плотная часть требует torch и весов модели запроса: 1,1 ГБ памяти против
      # 512 МБ бесплатного тарифа. Онлайн отдает лексическую выдачу и честно
      # помечает это в ответе.
      - key: RUFINRAG_DISABLE_DENSE
        value: "1"
      - key: RUFINRAG_DEFAULT_CONFIG
        value: bm25
      - key: RUFINRAG_LIVE
        value: "1"
      # Журнал запросов пишется вне клона репозитория. Иначе процесс дописывал
      # бы в файл суток, приехавший из git, и отдавал ночной выгрузке всю
      # историю обратно каждый раз.
      - key: RUFINRAG_EVENT_DIR
        value: /tmp/rufinrag-events
      # Секрет ручки выдачи журнала. Задается в панели Render (sync: false),
      # потому что значения секретов в чертеже не лежат. Пока переменной нет,
      # ручка отвечает 404 и ночная выгрузка пропускает шаг.
      - key: RUFINRAG_EVENTS_TOKEN
        sync: false
